<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LOGO 对比</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1115;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:48px}
h1{font-size:24px;font-weight:500;opacity:.7;letter-spacing:-.02em}
.row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:20px;padding:32px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.card img{width:128px;height:128px;border-radius:14px;object-fit:cover}
.card .small{display:flex;gap:12px;align-items:center}
.card .small img{width:48px;height:48px;border-radius:10px}
.card .small span{font-size:13px;opacity:.5}
.label{font-size:14px;font-weight:600;color:#e8a14b;letter-spacing:.05em}
.desc{font-size:12px;opacity:.5;max-width:180px;text-align:center;line-height:1.5}
</style></head><body>
<h1>Daily Forge LOGO 对比</h1>
<div class="row">
  <div class="card">
    <span class="label">V1 · 铁砧+火花</span>
    <img src="assets/logo-daily-forge-v1.png">
    <div class="small"><img src="assets/logo-daily-forge-v1.png"><span>48px 效果</span></div>
    <p class="desc">传统锻造意象，铁砧+飞溅火花=知识</p>
  </div>
  <div class="card">
    <span class="label">V2 · 钻石切面</span>
    <img src="assets/logo-daily-forge-v2.png">
    <div class="small"><img src="assets/logo-daily-forge-v2.png"><span>48px 效果</span></div>
    <p class="desc">几何钻石+光点=打磨粗矿为精华</p>
  </div>
  <div class="card">
    <span class="label">V3 · 火焰+笔尖</span>
    <img src="assets/logo-daily-forge-v3.png">
    <div class="small"><img src="assets/logo-daily-forge-v3.png"><span>48px 效果</span></div>
    <p class="desc">几何火焰+负空间笔尖=淬火书写</p>
  </div>
</div>
</body></html>
